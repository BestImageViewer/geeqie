name: Geeqie x86_64 AppImage build
run-name: ${{ github.actor }} is running Geeqie x86_64 AppImage build
on: [push]

permissions:
  contents: write

jobs:
  Build-AppImage:
    runs-on: ubuntu-26.04
    name: Build x86_64 AppImage (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: release
            buildtype: release
            filename: Geeqie-latest-x86_64.AppImage
          - variant: debug
            buildtype: debug
            filename: Geeqie-latest-x86_64-debug.AppImage

    env:
      BUILD_VARIANT: ${{ matrix.variant }}
      BUILD_TYPE: ${{ matrix.buildtype }}
      APPIMAGE_FILENAME: ${{ matrix.filename }}

    container:
      image: ubuntu:26.04

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            appstream \
            binutils \
            build-essential \
            curl \
            desktop-file-utils \
            docbook-xsl \
            dpkg-dev \
            dbus-daemon \
            file \
            findutils \
            fop \
            fuse \
            gettext \
            git \
            libarchive-dev \
            libcfitsio-dev \
            libdjvulibre-dev \
            libdw-dev \
            libdwarf-dev \
            libffmpegthumbnailer-dev \
            libgexiv2-dev \
            libgtk-4-dev \
            libheif-dev \
            libimath-dev \
            libjxl-dev \
            liblcms2-dev \
            liblua5.3-dev \
            libomp-dev \
            libopenexr-dev \
            libopenjp2-7-dev \
            libpoppler-glib-dev \
            libraw-dev \
            librsvg2-dev \
            librsvg2-bin \
            libshumate-dev \
            libspelling-1-dev \
            libunwind-dev \
            libwebp-dev \
            libwebp7 \
            libxml2-utils \
            meson \
            ninja-build \
            pandoc \
            patchelf \
            pkgconf \
            python3 \
            python3-pip \
            python3-venv \
            wget \
            zsync \
            xauth \
            xvfb \
            xsltproc \
            yelp-tools

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark repo as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Meson setup
        run: |
          meson setup build --prefix=/usr --datadir=share \
            --buildtype="$BUILD_TYPE" -Dstrip=false -Dcms=enabled -Dexecinfo=enabled

      - name: Ninja compile
        run: DESTDIR="$GITHUB_WORKSPACE/AppDir" ninja -C build install

      - name: Record debug build information
        if: matrix.variant == 'debug'
        run: |
          {
            printf 'Geeqie debug AppImage\nCommit: '
            git rev-parse HEAD
            printf 'Build type: %s\n' "$BUILD_TYPE"
          } > "$APPIMAGE_FILENAME.build-info.txt"
          mkdir -p AppDir/usr/share/geeqie
          cp "$APPIMAGE_FILENAME.build-info.txt" AppDir/usr/share/geeqie/debug-build-info.txt

      # The linuxdeploy-plugin-gtk forces the backend to be X11, as it was considered
      # that Wayland has problems. Delete this and let the user choose.
      - name: Download linuxdeploy and plugin
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          wget https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-plugin-gtk.sh
          sed -i '/GDK_BACKEND/d' linuxdeploy-plugin-gtk.sh

      - name: Extract linuxdeploy to avoid FUSE
        run: |
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract
          mv squashfs-root linuxdeploy

      - name: Build AppImage
        run: |
          if [ "$BUILD_VARIANT" = debug ]; then
            export NO_STRIP=1
          fi
          rsvg-convert --width=256 --height=256 \
            --output="$GITHUB_WORKSPACE/AppDir/geeqie.png" \
            "$GITHUB_WORKSPACE/AppDir/usr/share/icons/hicolor/scalable/apps/geeqie.svg"
          cp "$GITHUB_WORKSPACE/AppDir/geeqie.png" "$GITHUB_WORKSPACE/AppDir/.DirIcon"
          DEPLOY_GTK_VERSION=4 \
            LDAI_OUTPUT="$APPIMAGE_FILENAME" \
            LDAI_UPDATE_INFORMATION="gh-releases-zsync|BestImageViewer|geeqie|continuous|$APPIMAGE_FILENAME.zsync" \
            ./linuxdeploy/AppRun --appdir "$GITHUB_WORKSPACE/AppDir" \
            --desktop-file "$GITHUB_WORKSPACE/AppDir/usr/share/applications/org.geeqie.Geeqie.desktop" \
            --plugin gtk \
            --output appimage

      - name: Verify packaged debug symbols and crash backtrace
        if: matrix.variant == 'debug'
        run: |
          xvfb-run --auto-servernum dbus-run-session -- env GDK_BACKEND=x11 GSK_RENDERER=cairo \
            python3 build-aux/check-debug-appimage.py "$APPIMAGE_FILENAME" \
              --output-dir build/debug-appimage-check
          sha256sum "$APPIMAGE_FILENAME" >> "$APPIMAGE_FILENAME.build-info.txt"

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: continuous
          name: Continuous build
          prerelease: true
          artifacts: "${{ matrix.filename }}*"

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-all-build-appimage-${{ matrix.variant }}
          path: |
            ${{ github.workspace }}/build/meson-logs/*.txt
            ${{ github.workspace }}/build/debug-appimage-check/*.log
            ${{ github.workspace }}/build/debug-appimage-check/*.txt
          retention-days: 5
